<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><title>Isibindi Hybrid Training Log</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#111214"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Isibindi Log"><link rel="apple-touch-icon" href="icon.png"><style>
:root{--gold:#FCB514;--ink:#111214;--panel:#1c1e21;--panel2:#25282c;--text:#f5f5f5;--muted:#aeb3b8;--border:#3a3e43}*{box-sizing:border-box}body{margin:0;background:#0d0e10;color:var(--text);font:16px system-ui,-apple-system,sans-serif}.app{max-width:520px;margin:auto;padding:env(safe-area-inset-top) 10px calc(18px + env(safe-area-inset-bottom))}.brand{background:var(--ink);border-left:5px solid var(--gold);border-radius:14px;padding:14px;margin-top:8px}.eyebrow{color:var(--gold);font-size:10px;font-weight:900;letter-spacing:.2em}.brand h1{font-size:22px;margin:3px 0}.tag{color:var(--gold);font-size:12px;font-weight:800}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0;position:sticky;top:0;background:#0d0e10;padding:6px 0;z-index:5}.nav button,.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:10px;min-height:48px;font-weight:800}.nav button{font-size:10px;padding:4px 1px}.nav .active,.primary{background:var(--gold);color:#111;border-color:var(--gold)}.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:13px;margin-bottom:10px}h2,h3{margin:0 0 10px;font-size:16px}label{display:block;color:var(--muted);font-size:10px;font-weight:900;text-transform:uppercase;margin:0 0 4px}input,select,textarea{width:100%;min-height:48px;background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px;font-size:16px}textarea{min-height:90px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.space>*+*{margin-top:9px}.target{background:#111;border-left:4px solid var(--gold);border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;margin-top:10px}.target strong{font-size:26px}.gold{color:var(--gold)}.pill{border:1px solid var(--gold);border-radius:99px;padding:4px 7px;font-size:11px;font-weight:800}.sethead,.setrow{display:grid;grid-template-columns:24px 1fr 68px 58px;gap:5px;align-items:center}.sethead{color:var(--muted);font-size:10px;padding:10px 0 3px}.setrow{padding:4px 0;border-bottom:1px solid var(--border)}.setrow input{min-height:44px;padding:6px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.small{font-size:12px;color:var(--muted)}.hidden{display:none}.delete{width:44px;flex:0 0 44px}.historyItem{border-top:1px solid var(--border);padding:10px 0}.librow{padding:9px 0;border-bottom:1px solid var(--border)}.libctl{display:grid;grid-template-columns:1fr 44px;gap:6px;margin-top:6px}@media(min-width:700px){.app{max-width:760px}.nav button{font-size:12px}.form4{display:grid;grid-template-columns:2fr .7fr .7fr 1fr;gap:8px}.form4 .wide{grid-column:auto}}
</style></head><body><main class="app"><header class="brand"><div class="eyebrow">ISIBINDI HYBRID</div><h1>TRAINING LOG</h1><div class="tag">TRAIN WITH COURAGE.</div></header><nav class="nav"><button data-tab="workout" class="active">WORKOUT</button><button data-tab="conditioning">CONDITION</button><button data-tab="tests">TESTS / SIMS</button><button data-tab="library">LIBRARY</button><button data-tab="history">HISTORY</button></nav>
<section id="workout"><form id="addExercise" class="card space"><h2>ADD EXERCISE</h2><div><label>Exercise</label><select id="exName"></select></div><div class="grid2"><div><label>Sets</label><input id="sets" type="number" min="1" value="3"></div><div><label>Reps</label><input id="reps" type="number" min="1" value="5"></div></div><div><label>Target % 1RM</label><select id="percent"></select></div><button class="btn primary" style="width:100%">+ ADD TO WORKOUT</button></form><div id="workoutList"></div><div class="card"><h2>SESSION</h2><div class="grid2"><div><label>Session name</label><input id="sessionName" placeholder="Strength / Hybrid"></div><div><label>Session RPE</label><input id="sessionRpe" type="number" min="1" max="10"></div></div><label style="margin-top:8px">Notes</label><textarea id="sessionNotes" placeholder="How did it feel?"></textarea><button id="finish" class="btn primary" style="width:100%;margin-top:8px">FINISH & SAVE SESSION</button></div></section>
<section id="conditioning" class="hidden"><form id="condForm" class="card space"><h2>LOG CONDITIONING</h2><div><label>Movement</label><select id="condType"><option>Run</option><option>SkiErg</option><option>Row</option><option>Bike</option><option>Wall Balls</option><option>Burpee Broad Jumps</option><option>Farmers Carry</option><option>Sandbag Lunges</option><option>Other</option></select></div><div><label>Distance / reps</label><input id="condAmount" placeholder="1000m / 100 reps"></div><div><label>Time / pace</label><input id="condTime" placeholder="4:15 / 13 km/h"></div><div><label>RPE</label><input id="condRpe" type="number" min="1" max="10"></div><button class="btn primary">+ LOG EFFORT</button></form><div id="condList"></div></section>
<section id="tests" class="hidden"><form id="testForm" class="card space"><h2>TEST / SIM</h2><div><label>Test name</label><input id="testName" placeholder="Mini Tryka Sim" required></div><div><label>Total time / result</label><input id="testResult" placeholder="48:00 / 6:40 / 25:04"></div><div class="grid2"><div><label>RPE</label><input id="testRpe" type="number" min="1" max="10"></div><div><label>Date</label><input id="testDate" type="date"></div></div><div><label>Structure / components</label><textarea id="testStructure" placeholder="3 × 800m Run\n1000m Row\n1000m Ski\n60 × 15kg Thrusters"></textarea></div><div><label>Notes</label><textarea id="testNotes" placeholder="Pacing, transitions, fatigue..."></textarea></div><button class="btn primary">SAVE TEST</button></form><div id="testList"></div></section>
<section id="library" class="hidden"><div class="card"><h2>EXERCISE LIBRARY</h2><div class="small">Edit your movements and background 1RMs. Leave 1RM blank for accessories.</div><form id="libForm" class="space" style="margin-top:10px"><div><label>Exercise</label><input id="libName" required></div><div class="grid2"><div><label>Category</label><select id="libCat"><option>Lower</option><option>Upper Push</option><option>Upper Pull</option><option>Full Body</option><option>Core</option><option>Accessory</option></select></div><div><label>1RM kg</label><input id="libRm" type="number" step=".5"></div></div><button class="btn primary">+ ADD / UPDATE</button></form></div><div class="card"><div class="row"><h2>MOVEMENTS</h2><span id="libCount" class="pill"></span></div><div id="libList"></div></div></section>
<section id="history" class="hidden"><div class="card"><div class="row"><h2>SESSION HISTORY</h2><button id="clearHistory" class="btn">CLEAR</button></div><div id="historyList"></div></div></section></main><script>
const K='isibindiHybridLogV1'; const defaults=[['Back Squat','Lower',130],['Front Squat','Lower',0],['Goblet Squat','Lower',0],['Deadlift','Full Body',150],['Romanian Deadlift','Lower',0],['Bulgarian Split Squat','Lower',0],['Walking Lunge','Lower',0],['Reverse Lunge','Lower',0],['Leg Press','Lower',0],['Single Leg Press','Lower',0],['Leg Extension','Lower',0],['Hamstring Curl','Lower',0],['Hip Thrust','Lower',0],['Calf Raise','Lower',0],['Bench Press','Upper Push',0],['Incline Bench Press','Upper Push',0],['DB Bench Press','Upper Push',0],['Chest Press','Upper Push',0],['Overhead Press','Upper Push',0],['DB Shoulder Press','Upper Push',0],['Push Press','Upper Push',0],['Lateral Raise','Accessory',0],['Seated Row','Upper Pull',0],['Chest Supported Row','Upper Pull',0],['Bent Over Row','Upper Pull',0],['Single Arm DB Row','Upper Pull',0],['Lat Pulldown','Upper Pull',0],['Face Pull','Upper Pull',0],['Rear Delt Fly','Accessory',0],['Bicep Curl','Accessory',0],['Hammer Curl','Accessory',0],['Tricep Pushdown','Accessory',0],['Tricep Pullover','Accessory',0],['Farmers Carry','Full Body',0],['Thruster','Full Body',0],['Wall Ball','Full Body',0],['Burpee Broad Jump','Full Body',0],['Sandbag Lunge','Lower',0],['Plank','Core',0],['Dead Bug','Core',0],['Pallof Press','Core',0]];
let state=JSON.parse(localStorage.getItem(K)||'null')||{lib:defaults,work:[],cond:[],tests:[],history:[]}; if(!state.lib)state.lib=defaults;if(!state.work)state.work=[];if(!state.cond)state.cond=[];if(!state.tests)state.tests=[];if(!state.history)state.history=[]; const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c])); const save=()=>localStorage.setItem(K,JSON.stringify(state));
function tab(n){['workout','conditioning','tests','library','history'].forEach(x=>$(x).classList.toggle('hidden',x!==n));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===n));if(n==='library')renderLib();if(n==='history')renderHistory()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
$('percent').innerHTML=[50,55,60,65,70,72.5,75,77.5,80,82.5,85,87.5,90,92.5,95,100].map(x=>`<option ${x===80?'selected':''}>${x}</option>`).join('');
function picker(){let g={};state.lib.forEach((x,i)=>(g[x[1]]??=[]).push([x,i]));$('exName').innerHTML=Object.entries(g).map(([k,a])=>`<optgroup label="${esc(k)}">${a.map(([x,i])=>`<option value="${i}">${esc(x[0])}</option>`).join('')}</optgroup>`).join('')} function target(e){return e.rm?Math.round(e.rm*e.p/100/2.5)*2.5:0}
$('addExercise').onsubmit=e=>{e.preventDefault();let x=state.lib[+$('exName').value];if(!x)return;let s=+$('sets').value||1,r=+$('reps').value||1,p=+$('percent').value;state.work.push({name:x[0],rm:x[2],s,r,p,done:Array.from({length:s},()=>({w:'',r}))});save();renderWork()};
function renderWork(){picker();$('workoutList').innerHTML=state.work.map((e,ei)=>`<div class="card"><div class="row"><div><b>${esc(e.name)}</b><div class="small">${e.s} sets × ${e.r} reps @ ${e.p}%</div></div><button class="btn delete del" data-e="${ei}">×</button></div><div class="target"><div><div class="eyebrow">TODAY'S TARGET</div><strong>${e.rm?target(e)+' kg':'NO 1RM'}</strong></div><span class="pill gold">${e.p}%</span></div><div class="sethead"><span>#</span><span>KG</span><span>REPS</span><span>%</span></div>${e.done.map((s,i)=>`<div class="setrow"><b>${i+1}</b><input class="sw" data-e="${ei}" data-s="${i}" type="number" step=".5" value="${esc(s.w)}" placeholder="${target(e)||'kg'}"><input class="sr" data-e="${ei}" data-s="${i}" type="number" value="${esc(s.r)}"><span class="pill pct">${e.rm&&s.w?(+s.w/e.rm*100).toFixed(1)+'%':'—'}</span></div>`).join('')}</div>`).join('');document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{state.work.splice(+b.dataset.e,1);save();renderWork()});document.querySelectorAll('.sw').forEach(i=>i.oninput=()=>{let e=state.work[+i.dataset.e];e.done[+i.dataset.s].w=i.value;i.closest('.setrow').querySelector('.pct').textContent=e.rm&&i.value?(+i.value/e.rm*100).toFixed(1)+'%':'—';save()});document.querySelectorAll('.sr').forEach(i=>i.oninput=()=>{state.work[+i.dataset.e].done[+i.dataset.s].r=i.value;save()})}
$('condForm').onsubmit=e=>{e.preventDefault();state.cond.push({type:$('condType').value,a:$('condAmount').value,t:$('condTime').value,r:$('condRpe').value});['condAmount','condTime','condRpe'].forEach(x=>$(x).value='');save();renderCond()};function renderCond(){$('condList').innerHTML=state.cond.map((c,i)=>`<div class="card row"><div><b>${esc(c.type)}</b><div class="small">${esc(c.a)} ${esc(c.t)} ${c.r?'• RPE '+esc(c.r):''}</div></div><button class="btn delete dc" data-i="${i}">×</button></div>`).join('');document.querySelectorAll('.dc').forEach(b=>b.onclick=()=>{state.cond.splice(+b.dataset.i,1);save();renderCond()})}
$('testDate').value=new Date().toISOString().slice(0,10);$('testForm').onsubmit=e=>{e.preventDefault();state.tests.unshift({name:$('testName').value,result:$('testResult').value,rpe:$('testRpe').value,date:$('testDate').value,structure:$('testStructure').value,notes:$('testNotes').value});['testName','testResult','testRpe','testStructure','testNotes'].forEach(x=>$(x).value='');save();renderTests()};function renderTests(){$('testList').innerHTML=state.tests.map((t,i)=>`<div class="card"><div class="row"><div><b>${esc(t.name)}</b><div class="small">${esc(t.date)}</div></div><button class="btn delete dt" data-i="${i}">×</button></div><div class="target"><div><div class="eyebrow">RESULT</div><strong>${esc(t.result||'—')}</strong></div>${t.rpe?`<span class="pill gold">RPE ${esc(t.rpe)}</span>`:''}</div>${t.structure?`<div style="white-space:pre-line;margin-top:10px">${esc(t.structure)}</div>`:''}${t.notes?`<div class="small" style="margin-top:8px">${esc(t.notes)}</div>`:''}</div>`).join('');document.querySelectorAll('.dt').forEach(b=>b.onclick=()=>{state.tests.splice(+b.dataset.i,1);save();renderTests()})}
$('libForm').onsubmit=e=>{e.preventDefault();let n=$('libName').value.trim();if(!n)return;let item=[n,$('libCat').value,+$('libRm').value||0],i=state.lib.findIndex(x=>x[0].toLowerCase()===n.toLowerCase());if(i>=0)state.lib[i]=item;else state.lib.push(item);$('libName').value='';$('libRm').value='';save();renderLib();picker()};function renderLib(){$('libCount').textContent=state.lib.length;$('libList').innerHTML=state.lib.map((x,i)=>`<div class="librow"><div><b>${esc(x[0])}</b><div class="small">${esc(x[1])}</div></div><div class="libctl"><input class="lrm" data-i="${i}" type="number" step=".5" value="${x[2]||''}" placeholder="1RM kg"><button class="btn ldel" data-i="${i}">×</button></div></div>`).join('');document.querySelectorAll('.lrm').forEach(el=>el.onchange=()=>{let i=+el.dataset.i;state.lib[i][2]=+el.value||0;state.work.forEach(e=>{if(e.name===state.lib[i][0])e.rm=state.lib[i][2]});save();renderWork()});document.querySelectorAll('.ldel').forEach(b=>b.onclick=()=>{if(confirm('Delete this exercise?')){state.lib.splice(+b.dataset.i,1);save();renderLib();picker()}})}
$('finish').onclick=()=>{if(!state.work.length&&!state.cond.length)return alert('Add some training first.');let volume=0;state.work.forEach(e=>e.done.forEach(s=>volume+=(+s.w||0)*(+s.r||0)));let entry={date:new Date().toLocaleString(),name:$('sessionName').value||'Training Session',rpe:$('sessionRpe').value,notes:$('sessionNotes').value,work:JSON.parse(JSON.stringify(state.work)),cond:JSON.parse(JSON.stringify(state.cond)),volume};state.history.unshift(entry);state.work=[];state.cond=[];$('sessionName').value='';$('sessionRpe').value='';$('sessionNotes').value='';save();renderWork();renderCond();alert('Session saved to History.');tab('history')};function renderHistory(){$('historyList').innerHTML=state.history.length?state.history.map((h,i)=>`<div class="historyItem"><div class="row"><div><b>${esc(h.name)}</b><div class="small">${esc(h.date)}${h.rpe?' • RPE '+esc(h.rpe):''}</div></div><span class="pill">${Math.round(h.volume||0).toLocaleString()} kg</span></div><div class="small" style="margin-top:6px">${h.work.map(e=>esc(e.name)+' '+e.s+'×'+e.r+' @ '+e.p+'%').join(' • ')}</div>${h.cond.length?`<div class="small">${h.cond.map(c=>esc(c.type)+' '+esc(c.a)).join(' • ')}</div>`:''}${h.notes?`<div style="margin-top:6px">${esc(h.notes)}</div>`:''}</div>`).join(''):'<div class="small">No saved sessions yet.</div>'}$('clearHistory').onclick=()=>{if(confirm('Clear all session history?')){state.history=[];save();renderHistory()}};
picker();renderWork();renderCond();renderTests();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js").catch(()=>{}));}</script></body></html>
