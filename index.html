'use strict';const KEY='isibindi_interval_v1', AUDIO_KEY='isibindi_interval_audio_mode_v1';let audioMode=localStorage.getItem(AUDIO_KEY)||'beeps';if(!['beeps','voice','silent'].includes(audioMode))audioMode='beeps';let workouts=[],selected=-1,editing=null,chaos=false,phases=[],pi=0,left=0,deadline=0,running=false,started=0,lastBeep=0,audio=null,folderOpen={},query='',sort='newest';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>`${String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')}:${String(Math.max(0,s)%60).padStart(2,'0')}`;function load(){try{workouts=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(workouts))workouts=[]}catch{workouts=[]}}function save(){localStorage.setItem(KEY,JSON.stringify(workouts))}function beep(final=false){if(audioMode==='silent')return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=final?950:650;g.gain.value=.18;o.start();o.stop(audio.currentTime+(final?.32:.13))}catch{}}function speak(s){if(audioMode!=='voice'||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-IE';u.rate=1.06;speechSynthesis.speak(u)}catch{}}function audioSettings(){return `<div class="card"><label for="audioMode">Timer audio</label><select id="audioMode" onchange="setAudioMode(this.value)"><option value="beeps" ${audioMode==='beeps'?'selected':''}>Beeps only (Spotify friendly)</option><option value="voice" ${audioMode==='voice'?'selected':''}>Voice + beeps (may pause Spotify)</option><option value="silent" ${audioMode==='silent'?'selected':''}>Silent (visual only)</option></select><p class="tiny muted">Voice uses iPad speech synthesis, which may interrupt music. Beeps only is recommended for classes.</p></div>`}function setAudioMode(mode){if(!['beeps','voice','silent'].includes(mode))return;audioMode=mode;localStorage.setItem(AUDIO_KEY,mode);if(mode!=='voice'&&'speechSynthesis'in window)try{speechSynthesis.cancel()}catch{}}function isTransitionLabel(name){return /^(?:rest(?:\s*\/\s*change)?|change\s*(?:exercise|station|over)|transition|switch\s*(?:exercise|station)|move\s*(?:to\s*)?(?:next\s*)?station|water\s*break|hydration\s*break|block\s*recovery|active\s*recovery|recovery|mat\s*reset)(?:\s*[-–:]\s*.*)?$/i.test(String(name||'').trim())}function isRecoveryMove(m){return m.kind==='recovery'||isTransitionLabel(m.name)}function normalPhases(w,random=false){let out=[];w.blocks.forEach((b,bi)=>{for(let r=1;r<=b.rounds;r++)for(let m of b.moves){let work=random&&!isRecoveryMove(m)?[30,35,40,45][Math.floor(Math.random()*4)]:m.work;let rest=random&&!isRecoveryMove(m)?60-work:m.rest;if(work>0)out.push({label:m.name,seconds:work,type:isRecoveryMove(m)?'rest':'work',block:b.name,round:r,rounds:b.rounds});if(rest>0)out.push({label:'Rest',seconds:rest,type:'rest',block:b.name,round:r,rounds:b.rounds})}if(bi<w.blocks.length-1&&b.recovery>0)out.push({label:'Block recovery',seconds:b.recovery,type:'rest',block:b.name,round:b.rounds,rounds:b.rounds})});return out}function dur(w){return normalPhases(w).reduce((s,p)=>s+p.seconds,0)}function header(title){return `<h1>${esc(title)}</h1>`}function home(){editing=null;selected=-1;let a=$('app');a.innerHTML=header('ISIBINDI INTERVAL')+`<p>TRAIN WITH COURAGE · Offline interval coach</p><div class="card"><h2>GYM CLOCK</h2><p class="tiny">Rogue-style wall clock · EMOM · AMRAP · Tabata · Stopwatch · Intervals</p><button onclick="gymSetup()">⏱ Open Gym Clock</button></div>${audioSettings()}<div class="row"><button onclick="newWorkout()">＋ New workout</button><button onclick="importFile('csv')">Import CSV</button></div><div class="row"><button class="secondary" onclick="exportBackup()">Export backup</button><button class="secondary" onclick="importFile('json')">Restore backup</button></div><label>Search workouts</label><input id="search" placeholder="Name or folder" value="${esc(query)}" oninput="query=this.value;renderList()"><label>Sort</label><select onchange="sort=this.value;renderList()"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="az">A–Z</option><option value="za">Z–A</option></select><div id="list"></div>`;a.querySelector('select').value=sort;renderList()}function renderList(){let list=$('list');if(!list)return;let entries=workouts.map((w,i)=>({...w,i})).filter(w=>(w.name+' '+(w.folder||'Unfiled')).toLowerCase().includes(query.toLowerCase()));if(sort==='az')entries.sort((a,b)=>a.name.localeCompare(b.name));if(sort==='za')entries.sort((a,b)=>b.name.localeCompare(a.name));if(sort==='newest')entries.reverse();let folders=[...new Set(entries.map(w=>w.folder||'Unfiled'))];list.innerHTML=entries.length?folders.map(f=>`<div class="card"><div class="folder" onclick="folderOpen[${JSON.stringify(f)}]=!(folderOpen[${JSON.stringify(f)}]??true);renderList()" style="cursor:pointer">${folderOpen[f]===false?'▸':'▾'} ${esc(f)}</div>${folderOpen[f]===false?'':entries.filter(w=>(w.folder||'Unfiled')===f).map(w=>`<div class="entry"><strong>${esc(w.name)} <span class="muted tiny">${fmt(dur(w))}</span></strong><button onclick="preview(${w.i})">Open</button><button class="secondary" onclick="renameWorkout(${w.i})">⋯</button></div>`).join('')}</div>`).join(''):'<p>No saved workouts. Import a CSV or create one.</p>'}function renameWorkout(i){let choice=prompt('Type R to rename, F to move folder, or D to delete','R');if(!choice)return;let w=workouts[i];if(choice.toUpperCase()==='R'){let n=prompt('Workout name',w.name);if(n?.trim())w.name=n.trim()}else if(choice.toUpperCase()==='F'){let f=prompt('Folder name',w.folder||'Unfiled');if(f?.trim())w.folder=f.trim()}else if(choice.toUpperCase()==='D'){if(confirm('Delete '+w.name+'?'))workouts.splice(i,1)}save();home()}function preview(i){selected=i;let w=workouts[i];$('app').innerHTML=`<button class="secondary" onclick="home()">← Library</button>${header(w.name)}${audioSettings()}<p>${w.blocks.length} blocks · ${fmt(dur(w))} normal duration · ${esc(w.folder||'Unfiled')}</p><div class="card"><label><input type="checkbox" style="width:auto" id="chaos" ${chaos?'checked':''} onchange="chaos=this.checked"> <strong class="gold">⚡ RANDOM CHAOS MODE</strong></label><p class="tiny">Each regular exercise independently draws 30, 35, 40 or 45 seconds of work. Rest fills one minute. Repeats allowed. Explicit recovery unchanged.</p></div>${w.blocks.map(b=>`<div class="card"><h3 class="gold">${esc(b.name)} · ${b.rounds} rounds</h3>${b.moves.map(m=>`<div>${esc(m.name)} — ${m.work}s ${m.kind==='recovery'?'recovery':'work'} / ${m.rest}s rest</div>`).join('')}<p class="tiny">Block recovery: ${b.recovery||0}s</p></div>`).join('')}<button onclick="startWorkout()">▶ START WORKOUT</button> <button class="secondary" onclick="editWorkout(${i})">Edit workout</button>`}function newWorkout(){editing={name:'New workout',folder:'Unfiled',blocks:[{name:'Block 1',rounds:1,recovery:0,moves:[{name:'Exercise 1',work:45,rest:15,kind:'work'}]}]};editor()}function editWorkout(i){selected=i;editing=structuredClone(workouts[i]);editor()}function editor(){let w=editing;$('app').innerHTML=`<button class="secondary" onclick="home()">← Cancel</button>${header('Workout editor')}<label>Workout name</label><input id="wname" value="${esc(w.name)}"><label>Folder</label><input id="wfolder" value="${esc(w.folder||'Unfiled')}"><div id="blocks"></div><div class="row"><button class="secondary" onclick="addBlock()">＋ Add block</button><button onclick="saveEditor()">SAVE WORKOUT</button></div>`;renderBlocks()}function syncEditor(){if(!$('wname'))return;editing.name=$('wname').value;editing.folder=$('wfolder').value;editing.blocks.forEach((b,i)=>{if(!$(`bn${i}`))return;b.name=$(`bn${i}`).value;b.rounds=Number($(`br${i}`).value);b.recovery=Number($(`bc${i}`).value);b.moves.forEach((m,j)=>{m.name=$(`mn${i}_${j}`).value;m.work=Number($(`mw${i}_${j}`).value);m.rest=Number($(`mr${i}_${j}`).value);m.kind=$(`mk${i}_${j}`).value})})}function renderBlocks(){let root=$('blocks');root.innerHTML=editing.blocks.map((b,i)=>`<div class="card"><h3>Block ${i+1}</h3><label>Name</label><input id="bn${i}" value="${esc(b.name)}"><div class="row"><div><label>Rounds</label><input type="number" min="1" id="br${i}" value="${b.rounds}"></div><div><label>Block rest (sec)</label><input type="number" min="0" id="bc${i}" value="${b.recovery||0}"></div></div>${b.moves.map((m,j)=>`<div class="card"><label>Exercise</label><input id="mn${i}_${j}" value="${esc(m.name)}"><div class="row"><div><label>Work (sec)</label><input type="number" min="1" id="mw${i}_${j}" value="${m.work}"></div><div><label>Rest (sec)</label><input type="number" min="0" id="mr${i}_${j}" value="${m.rest}"></div></div><label>Type</label><select id="mk${i}_${j}"><option value="work" ${m.kind!=='recovery'?'selected':''}>Work</option><option value="recovery" ${m.kind==='recovery'?'selected':''}>Recovery</option></select><button class="secondary" onclick="removeMove(${i},${j})">Remove exercise</button></div>`).join('')}<div class="row"><button class="secondary" onclick="addMove(${i})">＋ Exercise</button><button class="danger" onclick="removeBlock(${i})">Remove block</button></div></div>`).join('')}function addBlock(){syncEditor();editing.blocks.push({name:'Block '+(editing.blocks.length+1),rounds:1,recovery:0,moves:[]});renderBlocks()}function removeBlock(i){syncEditor();editing.blocks.splice(i,1);renderBlocks()}function addMove(i){syncEditor();editing.blocks[i].moves.push({name:'New exercise',work:45,rest:15,kind:'work'});renderBlocks()}function removeMove(i,j){syncEditor();editing.blocks[i].moves.splice(j,1);renderBlocks()}function saveEditor(){syncEditor();let w=editing;if(!w.name.trim()||!w.blocks.some(b=>b.moves.length)||w.blocks.some(b=>!b.name.trim()||!Number.isInteger(b.rounds)||b.rounds<1||!Number.isInteger(b.recovery)||b.recovery<0||b.moves.some(m=>!m.name.trim()||!Number.isInteger(m.work)||m.work<1||!Number.isInteger(m.rest)||m.rest<0))){alert('Check names, rounds and durations. Work must be positive and rest cannot be negative.');return}w.name=w.name.trim();w.folder=w.folder.trim()||'Unfiled';if(selected>=0)workouts[selected]=w;else selected=workouts.push(w)-1;save();editing=null;preview(selected)}// Screen Wake Lock: best effort on supported iPadOS/Safari versions.
let screenWakeLock=null;
async function acquireScreenWakeLock(){
  if(!('wakeLock' in navigator)||document.visibilityState!=='visible'||$('player').classList.contains('hide'))return;
  if(screenWakeLock&&!screenWakeLock.released)return;
  try{
    const lock=await navigator.wakeLock.request('screen');
    screenWakeLock=lock;
    lock.addEventListener('release',()=>{if(screenWakeLock===lock)screenWakeLock=null});
  }catch(err){console.info('Screen wake lock unavailable:',err?.message||err)}
}
async function releaseScreenWakeLock(){
  const lock=screenWakeLock;screenWakeLock=null;
  if(lock)try{await lock.release()}catch{}
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&!$('player').classList.contains('hide'))acquireScreenWakeLock();
});
function startWorkout(){let w=workouts[selected];phases=normalPhases(w,chaos);if(!phases.length)return alert('No timed exercises');pi=0;left=phases[0].seconds*1000;deadline=performance.now()+left;started=Date.now();running=true;lastBeep=0;$('player').classList.remove('hide');acquireScreenWakeLock();announce();updatePlayer()}function announce(){beep(true);let p=phases[pi],n=phases.slice(pi+1).find(x=>x.type==='work');speak(p.type==='work'?p.label+'. Go!':'Rest. '+(n?'Next: '+n.label:''))}function updatePlayer(){let p=phases[pi];if(!p)return;$('player').classList.toggle('rest',p.type==='rest');$('player').classList.toggle('paused',!running);$('meta').textContent=`${chaos?'⚡ CHAOS · ':''}${p.type.toUpperCase()} · ${p.block} · ROUND ${p.round}/${p.rounds}`;$('clock').textContent=fmt(Math.ceil(left/1000));$('exercise').textContent=p.label.toUpperCase();let n=phases.slice(pi+1).find(x=>x.type==='work');$('next').textContent='NEXT EXERCISE: '+(n?`${n.label} · ${n.seconds}s`:'Workout complete');$('elapsed').textContent='ELAPSED '+fmt(Math.floor((Date.now()-started)/1000));$('progress').value=Math.round(1000*(1-left/(p.seconds*1000)));$('pauseBtn').textContent=running?'Ⅱ Pause':'▶ Resume'}function tick(){if(!$('player').classList.contains('hide')&&running){left=Math.max(0,deadline-performance.now());let s=Math.ceil(left/1000);if(s>=1&&s<=3&&lastBeep!==s){lastBeep=s;beep()}if(left<=0){skip(1);return}updatePlayer()}}setInterval(tick,120);function skip(d){pi+=d;if(pi>=phases.length){finishWorkout();return}pi=Math.max(0,pi);left=phases[pi].seconds*1000;deadline=performance.now()+left;lastBeep=0;updatePlayer();announce()}function togglePause(){if(running){left=Math.max(0,deadline-performance.now());running=false;try{speechSynthesis.cancel()}catch{}}else{deadline=performance.now()+left;running=true}updatePlayer()}function finishWorkout(){running=false;releaseScreenWakeLock();$('player').classList.add('hide');try{speechSynthesis.cancel()}catch{};if(selected>=0)preview(selected);else home();alert('Workout complete! Train with courage.')}function exitPlayer(){if(!confirm('Exit workout?'))return;running=false;releaseScreenWakeLock();$('player').classList.add('hide');try{speechSynthesis.cancel()}catch{};if(selected>=0)preview(selected);else home()}
function importFile(type){let f=$('file');f.value='';f.accept=type==='csv'?'.csv,text/csv':'.json,application/json';f.onchange=async()=>{if(!f.files.length)return;let content=await f.files[0].text();try{if(type==='csv'){let w=parseCSV(content,f.files[0].name.replace(/\.csv$/i,''));let details=w.blocks.map(b=>`${b.name}: ${b.moves.length} movements × ${b.rounds} rounds, ${b.recovery}s block rest`).join('\n');if(!confirm(`Import ${w.name}?\n${details}\nTotal: ${fmt(dur(w))}`))return;let folder=prompt('Save to folder', 'Unfiled');if(folder===null)return;w.folder=folder.trim()||'Unfiled';workouts.push(w)}else{let data=JSON.parse(content);if(!Array.isArray(data)||!data.every(validWorkout))throw Error('Invalid Isibindi workout backup');if(!confirm(`Restore ${data.length} workouts? This REPLACES the current library. Export your current backup first.`))return;workouts=data}save();home();alert('Import successful')}catch(e){alert('Import failed: '+e.message)}};f.click()}function validWorkout(w){return w&&typeof w.name==='string'&&Array.isArray(w.blocks)&&w.blocks.every(b=>typeof b.name==='string'&&Number.isInteger(b.rounds)&&b.rounds>=1&&Array.isArray(b.moves)&&b.moves.every(m=>typeof m.name==='string'&&Number.isInteger(m.work)&&m.work>0&&Number.isInteger(m.rest)&&m.rest>=0))}function exportBackup(){let blob=new Blob([JSON.stringify(workouts,null,2)],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='isibindi-interval-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}function csvRows(s){s=s.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell.trim());cell=''}else if((c==='\n'||c==='\r')&&!quoted){row.push(cell.trim());if(row.some(x=>x))rows.push(row);row=[];cell='';if(c==='\r'&&s[i+1]==='\n')i++}else cell+=c}if(quoted)throw Error('Unclosed quoted CSV field');row.push(cell.trim());if(row.some(x=>x))rows.push(row);return rows}function parseTime(s,line,allowZero){if(!s)throw Error(`Line ${line}: missing duration`);let n;if(/^\d+$/.test(s))n=Number(s);else if(/^\d+:[0-5]\d$/.test(s)){let [m,sec]=s.split(':').map(Number);n=m*60+sec}else throw Error(`Line ${line}: invalid duration ${s}`);if(!Number.isSafeInteger(n)||n<0||(!allowZero&&n===0))throw Error(`Line ${line}: invalid duration ${s}`);return n}function parseCSV(content,name){let rows=csvRows(content);if(rows.length<2)throw Error('CSV needs a header and at least one exercise');let h=rows.shift().map(s=>s.toLowerCase().replace(/[^a-z0-9]/g,''));let col=(...names)=>h.findIndex(x=>names.includes(x));let ix={name:col('exercise','movement','activity','name'),work:col('worksec','workseconds','work','duration','durationsec','time','interval'),rest:col('restsec','restseconds','rest','recovery'),block:col('block','section','group'),rounds:col('rounds','round','repeats','repeat'),kind:col('type','intervaltype'),recovery:col('blockrestsec','blockrestseconds','blockrecoverysec','blockrecoveryseconds')};if(ix.name<0||ix.work<0)throw Error('CSV must contain Exercise and Work (sec) columns');let blocks=[],seen=new Set();rows.forEach((r,i)=>{let line=i+2,get=k=>ix[k]<0?'':(r[ix[k]]||'').trim(),bn=get('block')||'Main Circuit',exercise=get('name');if(!exercise)throw Error(`Line ${line}: missing exercise`);let rounds=get('rounds')||'1';if(!/^\d+$/.test(rounds)||Number(rounds)<1)throw Error(`Line ${line}: invalid rounds`);rounds=Number(rounds);let recovery=get('recovery')?parseTime(get('recovery'),line,true):0;let kind=(get('kind')||'Work').toLowerCase();if(!['work','recovery'].includes(kind))throw Error(`Line ${line}: unknown Type`);let work=parseTime(get('work'),line,false),rest=get('rest')?parseTime(get('rest'),line,true):0;let b=blocks.at(-1);if(!b||b.name!==bn){if(seen.has(bn))throw Error(`Line ${line}: block ${bn} reappears non-contiguously`);seen.add(bn);b={name:bn,rounds,recovery,moves:[]};blocks.push(b)}else if(b.rounds!==rounds||b.recovery!==recovery)throw Error(`Line ${line}: conflicting block rounds or recovery`);b.moves.push({name:exercise,work,rest,kind})});return {name:name||'Imported workout',folder:'Unfiled',blocks}}
// Gym Clock v1.5 — independent of saved workout and CSV timers.
const GYM_KEY='isibindi_gym_clock_v1';
const gymDefaults={mode:'countdown',minutes:10,seconds:0,rounds:8,work:20,rest:10,emom:60,prep:10};
let gymCfg={...gymDefaults},gymSteps=[],gymIndex=0,gymRemaining=0,gymEnd=0,gymRunning=false,gymActive=false,gymLastCue=-1,gymWake=null,gymElapsed=0;
try{const saved=JSON.parse(localStorage.getItem(GYM_KEY)||'{}');for(const k of Object.keys(gymDefaults))if(Object.prototype.hasOwnProperty.call(saved,k))gymCfg[k]=saved[k]}catch{}
function gymSetup(){
  $('app').innerHTML=`<button class="secondary" onclick="home()">← Workout library</button><h1>ISIBINDI GYM CLOCK</h1><p>Wall-clock mode · big LED display · red work / green recovery</p>
  <div class="card gymSetup"><label for="gymMode">Timer programme</label><select id="gymMode" onchange="gymModeChanged()">
  <option value="countdown">Countdown</option><option value="countup">Count up</option><option value="stopwatch">Stopwatch (unlimited)</option><option value="emom">EMOM (every minute on the minute)</option><option value="amrap">AMRAP</option><option value="tabata">Tabata (20s / 10s)</option><option value="intervals">Custom work / rest</option></select>
  <div id="gymFields"></div><div class="row"><button onclick="gymStart()">▶ Start gym clock</button><button class="secondary" onclick="gymCfg={...gymDefaults};gymSetup()">Default settings</button></div></div>
  ${audioSettings()}<p class="tiny muted">On iPad, turn to landscape for the biggest digits. Start the clock with a tap to unlock the beeps. Sound uses the same Beeps Only / Voice / Silent setting as the interval timer.</p>`;
  $('gymMode').value=gymCfg.mode;gymModeChanged();
}
function gymModeChanged(){
  const mode=$('gymMode').value;gymCfg.mode=mode;
  const field=(id,label,val,min,max)=>`<div><label for="g_${id}">${label}</label><input id="g_${id}" type="number" inputmode="numeric" min="${min}" max="${max}" value="${val}"></div>`;
  const timed=['countdown','countup','amrap'].includes(mode);
  let html='<div class="row">';
  if(timed){html+=field('minutes','Minutes',gymCfg.minutes,0,999)+field('seconds','Seconds',gymCfg.seconds,0,59)}
  if(['emom','tabata','intervals'].includes(mode))html+=field('rounds','Rounds',gymCfg.rounds,1,999);
  if(mode==='emom')html+=field('emom','Interval length (sec)',gymCfg.emom,1,3600);
  if(mode==='intervals')html+=field('work','Work (sec)',gymCfg.work,1,3600)+field('rest','Rest (sec)',gymCfg.rest,0,3600);
  html+='</div><div class="row">'+field('prep','Preparation countdown (sec)',gymCfg.prep,0,120)+'</div>';
  if(mode==='tabata')html+='<p class="tiny">Tabata uses 20 seconds work / 10 seconds rest. No rest after the final round.</p>';
  if(mode==='emom')html+='<p class="tiny">EMOM counts down each interval. The next round begins automatically; no separate rest phase.</p>';
  if(mode==='stopwatch')html+='<p class="tiny">Unlimited stopwatch; pause and reset as needed.</p>';
  $('gymFields').innerHTML=html;
}
function gymRead(){
  const mode=$('gymMode').value,cfg={...gymCfg,mode};
  for(const k of ['minutes','seconds','rounds','work','rest','emom','prep']){
    const el=$('g_'+k);if(!el)continue;
    const n=Number(el.value);if(!Number.isSafeInteger(n)||n<Number(el.min)||n>Number(el.max)){alert('Check '+k+': enter a whole number from '+el.min+' to '+el.max);el.focus();return null}cfg[k]=n;
  }
  if(['countdown','countup','amrap'].includes(mode)&&cfg.minutes*60+cfg.seconds<1){alert('Set a duration greater than zero');return null}
  return cfg;
}
function gymBuild(c){
  let out=[],duration=c.minutes*60+c.seconds;
  if(c.prep)out.push({kind:'prep',label:'GET READY',seconds:c.prep,round:0,total:0});
  if(c.mode==='countdown')out.push({kind:'work',label:'COUNTDOWN',seconds:duration,round:1,total:1});
  if(c.mode==='countup'||c.mode==='amrap')out.push({kind:'work',label:c.mode==='amrap'?'AMRAP':'COUNT UP',seconds:duration,round:1,total:1,up:true});
  if(c.mode==='stopwatch')out.push({kind:'work',label:'STOPWATCH',seconds:Infinity,round:1,total:1,up:true});
  if(c.mode==='emom')for(let i=1;i<=c.rounds;i++)out.push({kind:'work',label:'EMOM',seconds:c.emom,round:i,total:c.rounds});
  if(c.mode==='tabata'||c.mode==='intervals')for(let i=1;i<=c.rounds;i++){
    out.push({kind:'work',label:'WORK',seconds:c.mode==='tabata'?20:c.work,round:i,total:c.rounds});
    if(i<c.rounds&&(c.mode==='tabata'||c.rest>0))out.push({kind:'rest',label:'REST',seconds:c.mode==='tabata'?10:c.rest,round:i,total:c.rounds});
  }
  return out;
}
async function gymWakeAcquire(){try{if('wakeLock'in navigator&&document.visibilityState==='visible'&&gymActive)gymWake=await navigator.wakeLock.request('screen')}catch{}}
async function gymWakeRelease(){try{await gymWake?.release()}catch{}gymWake=null}
function gymStart(){const c=gymRead();if(!c)return;gymCfg=c;localStorage.setItem(GYM_KEY,JSON.stringify(c));gymSteps=gymBuild(c);gymIndex=0;gymRemaining=gymSteps[0].seconds*1000;gymElapsed=0;gymActive=true;gymRunning=true;gymLastCue=-1;
  $('gymScreen').classList.remove('hide');gymEnd=performance.now()+gymRemaining;
  // iOS Web Audio must be unlocked from the user's Start tap.
  try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{}
  gymWakeAcquire();gymAnnounce();gymPaint();
}
function gymAnnounce(){const p=gymSteps[gymIndex];if(!p)return;beep(true);if(p.kind==='prep')speak('Get ready');else speak(p.label==='WORK'?'Work':p.label==='REST'?'Rest':p.label==='EMOM'?'Round '+p.round:p.label)}
function gymPaint(){if(!gymActive)return;const p=gymSteps[gymIndex];if(!p)return;
  const elapsed=p.seconds===Infinity?gymElapsed:Math.max(0,p.seconds*1000-gymRemaining);
  const display=p.up?Math.floor(elapsed/1000):Math.ceil(gymRemaining/1000);
  const mins=Math.floor(display/60),secs=display%60;
  $('gymDigits').textContent=String(mins).padStart(2,'0')+':'+String(secs).padStart(2,'0');
  $('gymDigits').classList.toggle('green',p.kind==='rest'||p.kind==='prep');
  $('gymStatus').textContent=p.label;
  $('gymRound').textContent=p.total>1?'ROUND '+p.round+' / '+p.total:gymCfg.mode.toUpperCase();
  $('gymSub').textContent=!gymRunning?'PAUSED':p.kind==='prep'?'STARTING SOON':p.kind==='rest'?'RECOVER · NEXT ROUND '+(p.round+1):p.total>1?'ROUND '+p.round+' OF '+p.total:'TRAIN WITH COURAGE';
  $('gymPause').textContent=gymRunning?'Ⅱ Pause':'▶ Resume';
}
function gymTick(){if(!gymActive||!gymRunning)return;const p=gymSteps[gymIndex];const now=performance.now();
  if(p.seconds===Infinity){gymElapsed=Math.max(0,now-gymEnd);gymPaint();return}
  gymRemaining=Math.max(0,gymEnd-now);
  const sec=Math.ceil(gymRemaining/1000);
  if(sec>=1&&sec<=3&&sec!==gymLastCue){gymLastCue=sec;beep()}
  if(gymRemaining<=0){gymIndex++;if(gymIndex>=gymSteps.length){gymComplete();return}const next=gymSteps[gymIndex];gymRemaining=next.seconds*1000;gymEnd=now+gymRemaining;gymLastCue=-1;gymAnnounce()}
  gymPaint();
}
setInterval(gymTick,75);
function gymToggle(){if(!gymActive)return;const p=gymSteps[gymIndex];if(gymRunning){if(p.seconds===Infinity)gymElapsed=performance.now()-gymEnd;else gymRemaining=Math.max(0,gymEnd-performance.now());gymRunning=false}else{gymEnd=performance.now()-(p.seconds===Infinity?gymElapsed:0)+(p.seconds===Infinity?0:gymRemaining);gymRunning=true;gymWakeAcquire()}gymPaint()}
function gymComplete(){gymRunning=false;gymActive=false;gymWakeRelease();beep(true);speak('Workout complete');$('gymDigits').textContent='00:00';$('gymStatus').textContent='FINISHED';$('gymSub').textContent='TRAIN WITH COURAGE';$('gymPause').textContent='▶ START';$('gymPause').disabled=true}
function gymReset(){if(!gymSteps.length)return;gymIndex=0;gymRemaining=gymSteps[0].seconds*1000;gymElapsed=0;gymRunning=false;gymActive=true;gymLastCue=-1;$('gymPause').disabled=false;gymPaint()}
function gymClose(){gymRunning=false;gymActive=false;gymWakeRelease();$('gymScreen').classList.add('hide');$('gymPause').disabled=false;try{speechSynthesis.cancel()}catch{};gymSetup()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&gymActive&&gymRunning)gymWakeAcquire()});

load();home();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
