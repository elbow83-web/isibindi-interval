<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151515"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Isibindi Interval"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>Isibindi Interval</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f9f9f9;background:#151515}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:20px 15px 60px}h1,h2,h3{margin:12px 0}h1{color:#fcb514;font-size:27px}h2{color:#fcb514}p,.muted{color:#bdbdbd}button,input,select{font:inherit}button{background:#fcb514;border:0;border-radius:9px;padding:12px 16px;color:#111;font-weight:750;cursor:pointer}button.secondary{background:#383838;color:white}button.danger{background:#682424;color:white}button:disabled{opacity:.45}input,select{background:#292929;color:white;border:1px solid #666;border-radius:7px;padding:11px;width:100%;min-width:0}label{display:block;margin:12px 0 5px;color:#ddd}.card{background:#242424;border:1px solid #383838;border-radius:12px;padding:15px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.tiny{font-size:13px}.gold{color:#fcb514}.hide{display:none!important}.folder{font-weight:800;font-size:19px;color:#fcb514}.entry{display:flex;gap:8px;align-items:center;margin:8px 0}.entry strong{flex:1}.entry button{flex:0 0 auto;padding:9px}#player{position:fixed;inset:0;z-index:5;background:#b71c1c;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(18px,env(safe-area-inset-top)) 12px max(20px,env(safe-area-inset-bottom));text-align:center}#player.rest{background:#1557a0}#player h2{color:white;font-size:clamp(30px,6vw,70px);overflow-wrap:anywhere}#clock{font-size:clamp(85px,23vw,230px);font-weight:900;line-height:1;letter-spacing:-.07em;font-variant-numeric:tabular-nums}#player .controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}#player .controls button{background:#fff}#player .controls button.secondary{background:#222;color:white}#player .meta{font-weight:700}#player .next{font-size:clamp(16px,3vw,25px)}#progress{width:95%;height:9px;accent-color:#fcb514}#player.paused #pauseLabel{display:block}#pauseLabel{display:none;font-size:22px;font-weight:900}body:has(#player:not(.hide)){overflow:hidden}@media(orientation:landscape){#player{padding:6px 12px}#clock{font-size:min(32vh,20vw)}#player h2{font-size:clamp(22px,5vh,42px);margin:0}#player .controls button{padding:7px 15px}#player .next{font-size:16px}}
</style></head><body><main id="app"></main><section id="player" class="hide"><div class="meta" id="meta"></div><div id="pauseLabel">PAUSED</div><div><div id="clock">00:00</div><h2 id="exercise"></h2></div><div style="width:100%"><div class="next" id="next"></div><p style="color:white" id="elapsed"></p><progress id="progress" max="1000" value="0"></progress></div><div class="controls"><button class="secondary" onclick="skip(-1)">◀ Back</button><button id="pauseBtn" onclick="togglePause()">Ⅱ Pause</button><button class="secondary" onclick="skip(1)">Next ▶</button><button class="secondary" onclick="exitPlayer()">Exit</button></div></section><input id="file" type="file" accept=".csv,text/csv,.json,application/json" class="hide"><script>
'use strict';const KEY='isibindi_interval_v1', AUDIO_KEY='isibindi_interval_audio_mode_v1';let audioMode=localStorage.getItem(AUDIO_KEY)||'beeps';if(!['beeps','voice','silent'].includes(audioMode))audioMode='beeps';let workouts=[],selected=-1,editing=null,chaos=false,phases=[],pi=0,left=0,deadline=0,running=false,started=0,lastBeep=0,audio=null,folderOpen={},query='',sort='newest';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>`${String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')}:${String(Math.max(0,s)%60).padStart(2,'0')}`;function load(){try{workouts=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(workouts))workouts=[]}catch{workouts=[]}}function save(){localStorage.setItem(KEY,JSON.stringify(workouts))}function beep(final=false){if(audioMode==='silent')return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=final?950:650;g.gain.value=.18;o.start();o.stop(audio.currentTime+(final?.32:.13))}catch{}}function speak(s){if(audioMode!=='voice'||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-IE';u.rate=1.06;speechSynthesis.speak(u)}catch{}}function audioSettings(){return `<div class="card"><label for="audioMode">Timer audio</label><select id="audioMode" onchange="setAudioMode(this.value)"><option value="beeps" ${audioMode==='beeps'?'selected':''}>Beeps only (Spotify friendly)</option><option value="voice" ${audioMode==='voice'?'selected':''}>Voice + beeps (may pause Spotify)</option><option value="silent" ${audioMode==='silent'?'selected':''}>Silent (visual only)</option></select><p class="tiny muted">Voice uses iPad speech synthesis, which may interrupt music. Beeps only is recommended for classes.</p></div>`}function setAudioMode(mode){if(!['beeps','voice','silent'].includes(mode))return;audioMode=mode;localStorage.setItem(AUDIO_KEY,mode);if(mode!=='voice'&&'speechSynthesis'in window)try{speechSynthesis.cancel()}catch{}}function normalPhases(w,random=false){let out=[];w.blocks.forEach((b,bi)=>{for(let r=1;r<=b.rounds;r++)for(let m of b.moves){let work=random&&m.kind!=='recovery'?[30,35,40,45][Math.floor(Math.random()*4)]:m.work;let rest=random&&m.kind!=='recovery'?60-work:m.rest;if(work>0)out.push({label:m.name,seconds:work,type:m.kind==='recovery'?'rest':'work',block:b.name,round:r,rounds:b.rounds});if(rest>0)out.push({label:'Rest',seconds:rest,type:'rest',block:b.name,round:r,rounds:b.rounds})}if(bi<w.blocks.length-1&&b.recovery>0)out.push({label:'Block recovery',seconds:b.recovery,type:'rest',block:b.name,round:b.rounds,rounds:b.rounds})});return out}function dur(w){return normalPhases(w).reduce((s,p)=>s+p.seconds,0)}function header(title){return `<h1>${esc(title)}</h1>`}function home(){editing=null;selected=-1;let a=$('app');a.innerHTML=header('ISIBINDI INTERVAL')+`<p>TRAIN WITH COURAGE · Offline interval coach</p>${audioSettings()}<div class="row"><button onclick="newWorkout()">＋ New workout</button><button onclick="importFile('csv')">Import CSV</button></div><div class="row"><button class="secondary" onclick="exportBackup()">Export backup</button><button class="secondary" onclick="importFile('json')">Restore backup</button></div><label>Search workouts</label><input id="search" placeholder="Name or folder" value="${esc(query)}" oninput="query=this.value;renderList()"><label>Sort</label><select onchange="sort=this.value;renderList()"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="az">A–Z</option><option value="za">Z–A</option></select><div id="list"></div>`;a.querySelector('select').value=sort;renderList()}function renderList(){let list=$('list');if(!list)return;let entries=workouts.map((w,i)=>({...w,i})).filter(w=>(w.name+' '+(w.folder||'Unfiled')).toLowerCase().includes(query.toLowerCase()));if(sort==='az')entries.sort((a,b)=>a.name.localeCompare(b.name));if(sort==='za')entries.sort((a,b)=>b.name.localeCompare(a.name));if(sort==='newest')entries.reverse();let folders=[...new Set(entries.map(w=>w.folder||'Unfiled'))];list.innerHTML=entries.length?folders.map(f=>`<div class="card"><div class="folder" onclick="folderOpen[${JSON.stringify(f)}]=!(folderOpen[${JSON.stringify(f)}]??true);renderList()" style="cursor:pointer">${folderOpen[f]===false?'▸':'▾'} ${esc(f)}</div>${folderOpen[f]===false?'':entries.filter(w=>(w.folder||'Unfiled')===f).map(w=>`<div class="entry"><strong>${esc(w.name)} <span class="muted tiny">${fmt(dur(w))}</span></strong><button onclick="preview(${w.i})">Open</button><button class="secondary" onclick="renameWorkout(${w.i})">⋯</button></div>`).join('')}</div>`).join(''):'<p>No saved workouts. Import a CSV or create one.</p>'}function renameWorkout(i){let choice=prompt('Type R to rename, F to move folder, or D to delete','R');if(!choice)return;let w=workouts[i];if(choice.toUpperCase()==='R'){let n=prompt('Workout name',w.name);if(n?.trim())w.name=n.trim()}else if(choice.toUpperCase()==='F'){let f=prompt('Folder name',w.folder||'Unfiled');if(f?.trim())w.folder=f.trim()}else if(choice.toUpperCase()==='D'){if(confirm('Delete '+w.name+'?'))workouts.splice(i,1)}save();home()}function preview(i){selected=i;let w=workouts[i];$('app').innerHTML=`<button class="secondary" onclick="home()">← Library</button>${header(w.name)}${audioSettings()}<p>${w.blocks.length} blocks · ${fmt(dur(w))} normal duration · ${esc(w.folder||'Unfiled')}</p><div class="card"><label><input type="checkbox" style="width:auto" id="chaos" ${chaos?'checked':''} onchange="chaos=this.checked"> <strong class="gold">⚡ RANDOM CHAOS MODE</strong></label><p class="tiny">Each regular exercise independently draws 30, 35, 40 or 45 seconds of work. Rest fills one minute. Repeats allowed. Explicit recovery unchanged.</p></div>${w.blocks.map(b=>`<div class="card"><h3 class="gold">${esc(b.name)} · ${b.rounds} rounds</h3>${b.moves.map(m=>`<div>${esc(m.name)} — ${m.work}s ${m.kind==='recovery'?'recovery':'work'} / ${m.rest}s rest</div>`).join('')}<p class="tiny">Block recovery: ${b.recovery||0}s</p></div>`).join('')}<button onclick="startWorkout()">▶ START WORKOUT</button> <button class="secondary" onclick="editWorkout(${i})">Edit workout</button>`}function newWorkout(){editing={name:'New workout',folder:'Unfiled',blocks:[{name:'Block 1',rounds:1,recovery:0,moves:[{name:'Exercise 1',work:45,rest:15,kind:'work'}]}]};editor()}function editWorkout(i){selected=i;editing=structuredClone(workouts[i]);editor()}function editor(){let w=editing;$('app').innerHTML=`<button class="secondary" onclick="home()">← Cancel</button>${header('Workout editor')}<label>Workout name</label><input id="wname" value="${esc(w.name)}"><label>Folder</label><input id="wfolder" value="${esc(w.folder||'Unfiled')}"><div id="blocks"></div><div class="row"><button class="secondary" onclick="addBlock()">＋ Add block</button><button onclick="saveEditor()">SAVE WORKOUT</button></div>`;renderBlocks()}function syncEditor(){if(!$('wname'))return;editing.name=$('wname').value;editing.folder=$('wfolder').value;editing.blocks.forEach((b,i)=>{if(!$(`bn${i}`))return;b.name=$(`bn${i}`).value;b.rounds=Number($(`br${i}`).value);b.recovery=Number($(`bc${i}`).value);b.moves.forEach((m,j)=>{m.name=$(`mn${i}_${j}`).value;m.work=Number($(`mw${i}_${j}`).value);m.rest=Number($(`mr${i}_${j}`).value);m.kind=$(`mk${i}_${j}`).value})})}function renderBlocks(){let root=$('blocks');root.innerHTML=editing.blocks.map((b,i)=>`<div class="card"><h3>Block ${i+1}</h3><label>Name</label><input id="bn${i}" value="${esc(b.name)}"><div class="row"><div><label>Rounds</label><input type="number" min="1" id="br${i}" value="${b.rounds}"></div><div><label>Block rest (sec)</label><input type="number" min="0" id="bc${i}" value="${b.recovery||0}"></div></div>${b.moves.map((m,j)=>`<div class="card"><label>Exercise</label><input id="mn${i}_${j}" value="${esc(m.name)}"><div class="row"><div><label>Work (sec)</label><input type="number" min="1" id="mw${i}_${j}" value="${m.work}"></div><div><label>Rest (sec)</label><input type="number" min="0" id="mr${i}_${j}" value="${m.rest}"></div></div><label>Type</label><select id="mk${i}_${j}"><option value="work" ${m.kind!=='recovery'?'selected':''}>Work</option><option value="recovery" ${m.kind==='recovery'?'selected':''}>Recovery</option></select><button class="secondary" onclick="removeMove(${i},${j})">Remove exercise</button></div>`).join('')}<div class="row"><button class="secondary" onclick="addMove(${i})">＋ Exercise</button><button class="danger" onclick="removeBlock(${i})">Remove block</button></div></div>`).join('')}function addBlock(){syncEditor();editing.blocks.push({name:'Block '+(editing.blocks.length+1),rounds:1,recovery:0,moves:[]});renderBlocks()}function removeBlock(i){syncEditor();editing.blocks.splice(i,1);renderBlocks()}function addMove(i){syncEditor();editing.blocks[i].moves.push({name:'New exercise',work:45,rest:15,kind:'work'});renderBlocks()}function removeMove(i,j){syncEditor();editing.blocks[i].moves.splice(j,1);renderBlocks()}function saveEditor(){syncEditor();let w=editing;if(!w.name.trim()||!w.blocks.some(b=>b.moves.length)||w.blocks.some(b=>!b.name.trim()||!Number.isInteger(b.rounds)||b.rounds<1||!Number.isInteger(b.recovery)||b.recovery<0||b.moves.some(m=>!m.name.trim()||!Number.isInteger(m.work)||m.work<1||!Number.isInteger(m.rest)||m.rest<0))){alert('Check names, rounds and durations. Work must be positive and rest cannot be negative.');return}w.name=w.name.trim();w.folder=w.folder.trim()||'Unfiled';if(selected>=0)workouts[selected]=w;else selected=workouts.push(w)-1;save();editing=null;preview(selected)}function startWorkout(){let w=workouts[selected];phases=normalPhases(w,chaos);if(!phases.length)return alert('No timed exercises');pi=0;left=phases[0].seconds*1000;deadline=performance.now()+left;started=Date.now();running=true;lastBeep=0;$('player').classList.remove('hide');announce();updatePlayer()}function announce(){beep(true);let p=phases[pi],n=phases.slice(pi+1).find(x=>x.type==='work');speak(p.type==='work'?p.label+'. Go!':'Rest. '+(n?'Next: '+n.label:''))}function updatePlayer(){let p=phases[pi];if(!p)return;$('player').classList.toggle('rest',p.type==='rest');$('player').classList.toggle('paused',!running);$('meta').textContent=`${chaos?'⚡ CHAOS · ':''}${p.type.toUpperCase()} · ${p.block} · ROUND ${p.round}/${p.rounds}`;$('clock').textContent=fmt(Math.ceil(left/1000));$('exercise').textContent=p.label.toUpperCase();let n=phases.slice(pi+1).find(x=>x.type==='work');$('next').textContent='NEXT: '+(n?`${n.label} · ${n.seconds}s`:'Workout complete');$('elapsed').textContent='ELAPSED '+fmt(Math.floor((Date.now()-started)/1000));$('progress').value=Math.round(1000*(1-left/(p.seconds*1000)));$('pauseBtn').textContent=running?'Ⅱ Pause':'▶ Resume'}function tick(){if(!$('player').classList.contains('hide')&&running){left=Math.max(0,deadline-performance.now());let s=Math.ceil(left/1000);if(s>=1&&s<=3&&lastBeep!==s){lastBeep=s;beep()}if(left<=0){skip(1);return}updatePlayer()}}setInterval(tick,120);function skip(d){pi+=d;if(pi>=phases.length){exitPlayer();alert('Workout complete! Train with courage.');return}pi=Math.max(0,pi);left=phases[pi].seconds*1000;deadline=performance.now()+left;lastBeep=0;updatePlayer();announce()}function togglePause(){if(running){left=Math.max(0,deadline-performance.now());running=false;try{speechSynthesis.cancel()}catch{}}else{deadline=performance.now()+left;running=true}updatePlayer()}function exitPlayer(){if(!confirm('Exit workout?'))return;running=false;$('player').classList.add('hide');try{speechSynthesis.cancel()}catch{};if(selected>=0)preview(selected);else home()}
function importFile(type){let f=$('file');f.value='';f.accept=type==='csv'?'.csv,text/csv':'.json,application/json';f.onchange=async()=>{if(!f.files.length)return;let content=await f.files[0].text();try{if(type==='csv'){let w=parseCSV(content,f.files[0].name.replace(/\.csv$/i,''));let details=w.blocks.map(b=>`${b.name}: ${b.moves.length} movements × ${b.rounds} rounds, ${b.recovery}s block rest`).join('\n');if(!confirm(`Import ${w.name}?\n${details}\nTotal: ${fmt(dur(w))}`))return;let folder=prompt('Save to folder', 'Unfiled');if(folder===null)return;w.folder=folder.trim()||'Unfiled';workouts.push(w)}else{let data=JSON.parse(content);if(!Array.isArray(data)||!data.every(validWorkout))throw Error('Invalid Isibindi workout backup');if(!confirm(`Restore ${data.length} workouts? This REPLACES the current library. Export your current backup first.`))return;workouts=data}save();home();alert('Import successful')}catch(e){alert('Import failed: '+e.message)}};f.click()}function validWorkout(w){return w&&typeof w.name==='string'&&Array.isArray(w.blocks)&&w.blocks.every(b=>typeof b.name==='string'&&Number.isInteger(b.rounds)&&b.rounds>=1&&Array.isArray(b.moves)&&b.moves.every(m=>typeof m.name==='string'&&Number.isInteger(m.work)&&m.work>0&&Number.isInteger(m.rest)&&m.rest>=0))}function exportBackup(){let blob=new Blob([JSON.stringify(workouts,null,2)],{type:'application/json'});let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='isibindi-interval-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}function csvRows(s){s=s.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell.trim());cell=''}else if((c==='\n'||c==='\r')&&!quoted){row.push(cell.trim());if(row.some(x=>x))rows.push(row);row=[];cell='';if(c==='\r'&&s[i+1]==='\n')i++}else cell+=c}if(quoted)throw Error('Unclosed quoted CSV field');row.push(cell.trim());if(row.some(x=>x))rows.push(row);return rows}function parseTime(s,line,allowZero){if(!s)throw Error(`Line ${line}: missing duration`);let n;if(/^\d+$/.test(s))n=Number(s);else if(/^\d+:[0-5]\d$/.test(s)){let [m,sec]=s.split(':').map(Number);n=m*60+sec}else throw Error(`Line ${line}: invalid duration ${s}`);if(!Number.isSafeInteger(n)||n<0||(!allowZero&&n===0))throw Error(`Line ${line}: invalid duration ${s}`);return n}function parseCSV(content,name){let rows=csvRows(content);if(rows.length<2)throw Error('CSV needs a header and at least one exercise');let h=rows.shift().map(s=>s.toLowerCase().replace(/[^a-z0-9]/g,''));let col=(...names)=>h.findIndex(x=>names.includes(x));let ix={name:col('exercise','movement','activity','name'),work:col('worksec','workseconds','work','duration','durationsec','time','interval'),rest:col('restsec','restseconds','rest','recovery'),block:col('block','section','group'),rounds:col('rounds','round','repeats','repeat'),kind:col('type','intervaltype'),recovery:col('blockrestsec','blockrestseconds','blockrecoverysec','blockrecoveryseconds')};if(ix.name<0||ix.work<0)throw Error('CSV must contain Exercise and Work (sec) columns');let blocks=[],seen=new Set();rows.forEach((r,i)=>{let line=i+2,get=k=>ix[k]<0?'':(r[ix[k]]||'').trim(),bn=get('block')||'Main Circuit',exercise=get('name');if(!exercise)throw Error(`Line ${line}: missing exercise`);let rounds=get('rounds')||'1';if(!/^\d+$/.test(rounds)||Number(rounds)<1)throw Error(`Line ${line}: invalid rounds`);rounds=Number(rounds);let recovery=get('recovery')?parseTime(get('recovery'),line,true):0;let kind=(get('kind')||'Work').toLowerCase();if(!['work','recovery'].includes(kind))throw Error(`Line ${line}: unknown Type`);let work=parseTime(get('work'),line,false),rest=get('rest')?parseTime(get('rest'),line,true):0;let b=blocks.at(-1);if(!b||b.name!==bn){if(seen.has(bn))throw Error(`Line ${line}: block ${bn} reappears non-contiguously`);seen.add(bn);b={name:bn,rounds,recovery,moves:[]};blocks.push(b)}else if(b.rounds!==rounds||b.recovery!==recovery)throw Error(`Line ${line}: conflicting block rounds or recovery`);b.moves.push({name:exercise,work,rest,kind})});return {name:name||'Imported workout',folder:'Unfiled',blocks}}load();home();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script></body></html>
